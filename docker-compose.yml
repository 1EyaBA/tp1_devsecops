services:
  db:
    image: mysql:8.4
    env_file: ./back/.env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 10s
      retries: 10

  back:
    build: ./back
    env_file: ./back/.env
    environment:
      DB_HOST: db
      APP_HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  front:
    build: ./front
    ports:
      - "5173:80"
    depends_on:
      - back

volumes:
  db_data:
  uploads:
